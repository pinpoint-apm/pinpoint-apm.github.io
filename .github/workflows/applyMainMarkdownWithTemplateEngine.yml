# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Publish Pinpoint website

on:
# https://docs.github.com/en/actions/reference/events-that-trigger-workflows#repository_dispatch
  repository_dispatch:
    types: [release-pinpoint]
  schedule:
    - cron:  '00 5 * * *'
  workflow_dispatch:
    inputs:
      versions:
        description: 'GitBook versions to add, space-separated (e.g. v2.4.1 v2.4.2). Empty adds the latest Pinpoint release.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
    - run: npm ci --omit=dev
      working-directory: .github/actions/markdown-template-engine-action
    - name: Update main.md by Markdown template engin
      uses: ./.github/actions/markdown-template-engine-action
      with:
        template_markdown_file: ./main.md
        section_github_path: pinpoint-apm/pinpoint
      env:
        ACTIONS_STEP_DEBUG: true
    - name: Add GitBook version spaces
      uses: ./.github/actions/gitbook-versions-action
      with:
        versions: ${{ github.event.inputs.versions }}
        gitbook_token: ${{ secrets.GITBOOK_TOKEN }}
